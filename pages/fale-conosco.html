<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroBoost | Fale Conosco</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="page-body">
    <header class="site-header">
      <div class="container header-inner">
        <div class="header-row">
          <div class="brand">
            <svg class="icon brand-icon" viewBox="0 0 24 24">
              <path d="M5 19c0-7 5-13 14-14 1 9-5 15-14 14Z" />
              <path d="M5 19c3-5 7-8 11-9" />
            </svg>

            <div>
              <h1 class="brand-title">AgroBoost</h1>
              <p class="brand-subtitle">Consultor Agrícola Digital</p>
            </div>
          </div>

          <button id="menu-btn" class="menu-toggle" type="button">
            <svg class="icon" viewBox="0 0 24 24">
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
          </button>

          <nav class="desktop-nav">
            <a href="../index.html">Home</a>
            <a href="sistema.html">Sistema</a>
            <a href="fale-conosco.html">Fale Conosco</a>
          </nav>
        </div>

        <nav id="mobile-menu" class="mobile-nav hidden">
          <a href="../index.html">Home</a>
          <a href="sistema.html">Sistema</a>
          <a href="fale-conosco.html">Fale Conosco</a>
        </nav>
      </div>
    </header>

    <main class="contact-main">
      <div class="page-heading">
        <h2 class="page-title">Fale Conosco</h2>
        <p class="page-description">Entre em contato com a equipe AgroBoost.</p>
      </div>

      <form class="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input
            id="name"
            class="field"
            type="text"
            required
            placeholder="Seu nome"
          />
          <span class="field-error" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            class="field"
            type="email"
            required
            placeholder="email@exemplo.com"
          />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Telefone</label>
          <input
            id="phone"
            class="field"
            type="tel"
            required
            inputmode="tel"
            maxlength="15"
            placeholder="(11) 99999-9999"
          />
          <span class="field-error" id="phone-error"></span>
        </div>

        <div class="form-group">
          <label for="city">Cidade</label>
          <input
            id="city"
            class="field"
            type="text"
            required
            placeholder="Sua cidade"
          />
          <span class="field-error" id="city-error"></span>
        </div>

        <div class="form-group span-full">
          <label for="subject">Assunto</label>
          <input
            id="subject"
            class="field"
            type="text"
            required
            placeholder="Assunto da mensagem"
          />
          <span class="field-error" id="subject-error"></span>
        </div>

        <div class="form-group span-full">
          <label for="message">Mensagem</label>
          <textarea
            id="message"
            class="field"
            required
            rows="5"
            maxlength="500"
            placeholder="Digite sua mensagem"
          ></textarea>
          <div class="char-counter">
            <span id="message-count">0</span>/500 caracteres
          </div>
          <span class="field-error" id="message-error"></span>
        </div>

        <div class="span-full">
          <label class="checkbox-line">
            <input type="checkbox" id="consent" />
            <span>Autorizo contato da equipe AgroBoost.</span>
          </label>
          <span class="field-error" id="consent-error"></span>
        </div>

        <div class="span-full form-actions">
          <p class="form-feedback" id="form-feedback"></p>
          <button class="btn submit-button" type="submit">Enviar Mensagem</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <p>AgroBoost © 2026 - FIAP Engenharia de Software</p>
    </footer>

    <script src="../assets/js/script-contato.js"></script>
    <script src="../assets/js/script-header.js"></script>
  </body>
</html>
